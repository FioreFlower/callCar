<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>차량 이동 요청</title>
    <meta name="theme-color" content="#edf3fc" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="app" class="page" v-cloak>
      <section class="request-panel" aria-labelledby="page-title">
        <header class="hero">
          <h1 id="page-title">차량 이동 요청</h1>
          <p class="parking-note">잠시 주차 중입니다.<br />불편을 드려 죄송합니다.</p>
          <p class="request-guide">차량번호를 확인하신 후 이동 요청을 보내 주세요.</p>
          <div class="vehicle-card">
            <div class="car-mark" aria-hidden="true">
              <svg viewBox="0 0 64 64">
                <path d="M12 35h40l-5-14a6 6 0 0 0-6-4H23a6 6 0 0 0-6 4l-5 14Z" />
                <path d="M9 34h46a5 5 0 0 1 5 5v7a3 3 0 0 1-3 3h-5a6 6 0 0 1-12 0H24a6 6 0 0 1-12 0H7a3 3 0 0 1-3-3v-7a5 5 0 0 1 5-5Z" />
                <path d="M13 41h7m24 0h7" />
              </svg>
            </div>
            <div class="vehicle-details">
              <span>차량번호</span>
              <strong :class="{ 'plate-placeholder': !vehicleNumber || vehicleNumber === '차량번호 확인 필요' }">
                {{ vehicleNumber || "차량번호 확인 중" }}
              </strong>
            </div>
          </div>
        </header>

        <form class="form" @submit.prevent="submitRequest">
          <input
            v-model="website"
            class="trap"
            name="website"
            tabindex="-1"
            autocomplete="off"
            aria-hidden="true"
          />

          <div class="field">
            <label for="message">요청 내용</label>
            <textarea
              id="message"
              v-model.trim="message"
              maxlength="500"
              rows="2"
              required
              placeholder="차량 이동 부탁드립니다."
            ></textarea>
          </div>

          <div class="field">
            <label for="contact">연락처 <span class="optional">(선택)</span></label>
            <input
              id="contact"
              v-model.trim="contact"
              maxlength="80"
              inputmode="text"
              placeholder="회신을 원할 때만 입력해 주세요"
            />
          </div>

          <div
            v-if="turnstileSiteKey"
            ref="turnstile"
            class="turnstile-box"
            aria-label="스팸 방지 확인"
          ></div>

          <button class="submit-button" type="submit" :disabled="isSending">
            <svg v-if="!isSending" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M22 2 11 13" />
              <path d="m22 2-7 20-4-9-9-4 20-7Z" />
            </svg>
            {{ isSending ? "요청 보내는 중…" : "차량 이동 요청 보내기" }}
          </button>
          <div class="status" :class="isSending ? 'pending' : statusType" role="status">
            {{ isSending ? "차주에게 알림을 보내고 있어요." : statusMessage }}
          </div>
        </form>
        <section v-if="replySessions.length" class="replies" aria-label="차주 답변">
          <article v-for="session in replySessions" :key="session.token" class="reply-card">
            <h2>차주 답변 <span v-if="replySessions.length > 1">· {{ requestTime(session.requestedAt) }} 요청</span></h2>
            <p role="status">{{ session.reply || "차주의 답변이 이 화면에 자동으로 표시됩니다." }}</p>
          </article>
        </section>
      </section>
    </main>
    <script type="module" src="/script.js"></script>
  </body>
</html>
